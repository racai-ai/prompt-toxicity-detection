# Configuration for DeBERTa-v3-large sequence classification (e.g. SMM4H safe/unsafe).
#
# Usage:
#   hner train train.csv dev.csv out/ --config-file conf/bert-sequence-classification.yaml

model_type: bert_adapter
#model_name: microsoft/deberta-v3-large
model_name: aubmindlab/bert-large-arabertv02
#model_name: answerdotai/ModernBERT-large
metric: macro_f1
max_sequence_len: 512
learning_rate: 2.0e-5
warmup_ratio: 0.1
weight_decay: 0.01
warm_pipeline: true
